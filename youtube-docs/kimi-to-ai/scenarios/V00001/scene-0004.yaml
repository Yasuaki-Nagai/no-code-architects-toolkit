metadata:
  prompt_name: "High school student summons Bahamut in the classroom"
  base_style: "Smart Phone selfie, YouTuber Style, photorealistic, 4K"
  aspect_ratio: "16:9"
  location_description: "Many students are attending classes in a high school classroom in Japan."
  camera_setup: "A single, The camera is fixed on Ryo's desk, selfie-style."
  key_elements:
    - "Ryo(High school student)"
    - "Bahamut(A huge dragon that looks like something out of a Hollywood fantasy movie, with high definition and realism)"
  sub_elements:
    - "Other students"
  negative_prompts: ["no text overlays", "no distracting music"]
timeline:
  - sequence: 1
    timestamp: "00:00-00:02"
    action: "Ryo, sitting at his desk, speaks to the camera he has placed on the desk."
    audio: "perfect lip sync. The quiet hustle and bustle of the classroom before class."
    camera_work: "Fixed camera on the desk, focused on Ryo."
    voice:
      - actor: "Ryo"
        language: "Japanese"
        script: "Sore dewa, Sassoku shoukan shitemiyoh！"
        note: "Ryo is excited and speaking in a low voice."
  - sequence: 2
    timestamp: "00:02-00:04"
    action: "Ryo casts a summoning spell, and a magic circle appears around him. Other students start to notice and get feared."
    audio: "An eerie magical sound. The murmuring of other students."
    camera_work: "Fixed camera on the desk. The camera shakes slightly."
    voice:
      - actor: "Ryo"
        language: "Japanese"
        script: "Kodai no ryuu yoh!"
        note: "Ryo is determined and confident."
  - sequence: 3
    timestamp: "00:04-00:06"
    action: "Outside the classroom window, the clear sky suddenly darkened with clouds, and a sudden barrage of lightning struck, accompanied by Bahamut descending from the sky and roaring loudly. The students screamed and tried to escape."
    audio: "A powerful roar and the screams of students."
    camera_work: "Fixed camera on the desk. The image shakes violently due to the roar and impact."
    voice: null
  - sequence: 4
    timestamp: "00:06-00:08"
    action: "Bahamut breathes a huge flame toward the classroom."
    audio: "Bahamut's low growl and Ryo's laugh."
    camera_work: "Fixed camera on the desk. Bahamut's eye is visible in the background through the window, and Ryo is in the foreground."
    voice:
      - actor: "Ryo"
        language: "Japanese"
        script: "Hahaha! Korega bokuno chikara da!"
        note: "Ryo is laughing confidently."
