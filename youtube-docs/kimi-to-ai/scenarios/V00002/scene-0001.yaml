timeline:
  - sequence: 1
    timestamp: "00:00-00:04"
    action: "Grandma Hana speaking confidently to the camera, with bread hanging from strings visible in the background. Other elderly participants are preparing."
    audio: "perfect lip sync. Ambient sounds of the festival and excited chatter."
    camera_work: "Handheld camera focused on Grandma Hana, selfie style"
    voice:
      - actor: "Grandma Hana"
        language: "Japanese"
        script: "Mina-san konnichiwa! Kyoh wa pan kui kyohsoh ni sanka shimasu! Watashi no pawaa wo misete ageru wa!"
        note: "Grandma Hana is confident and energetic, speaking in Kansai dialect."
  - sequence: 2
    timestamp: "00:04-00:08"
    action: "Grandma Hana and other participants line up at the starting line. The referee is getting ready to start the competition."
    audio: "perfect lip sync. Crowd cheering and anticipation sounds, referee's voice preparing for start."
    camera_work: "Wide shot showing all participants at the starting line, then focusing back on Grandma Hana"
    voice:
      - actor: "Grandma Hana"
        language: "Japanese"
        script: "Zettai ni makenai! Minna no pan, moratte iku wa yo!"
        note: "Grandma Hana is determined and confident, with a mischievous smile."
