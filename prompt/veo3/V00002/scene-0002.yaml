timeline:
  - sequence: 1
    timestamp: "00:00-00:04"
    action: "All participants, including Grandma Hana, are in perfect crouching start positions at the starting line. The referee raises the starting pistol. Tension builds as everyone prepares for the signal. Grandma Hana's eyes show intense focus and determination."
    audio: "Quiet tension, crowd holding breath, referee's preparatory commands, slight rustling of clothing as participants adjust their positions."
    camera_work: "Close-up shots of participants in crouching positions, focusing on Grandma Hana's determined expression, then wide shot of the starting line"
    voice: null
  - sequence: 2
    timestamp: "00:04-00:08"
    action: "The starting pistol fires with a loud bang. Instantly, Grandma Hana explodes forward at supersonic speed, creating a massive shockwave that completely shatters the ground beneath her starting position. She rockets forward toward the bread course while other participants are still processing the start signal."
    audio: "Loud gunshot, immediate massive sonic boom, ground cracking and debris flying, gasps from stunned spectators and other participants."
    camera_work: "Slow-motion capture of the pistol firing, then explosive action as Grandma Hana launches forward, showing the ground destruction and her incredible acceleration"
    voice: null
